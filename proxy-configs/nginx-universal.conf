# ==============================================================================
# dHtools - Universal Nginx Reverse Proxy Configuration
# Compatible with: Ubuntu, Debian, CentOS, Rocky Linux, aaPanel, CloudPanel, etc.
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Proxy Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com;

    # SSL Certificates (Reemplaza con tus rutas de certificados SSL)
    ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    # Protocolos y Cifrados Seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    # Bloqueo de archivos ocultos y sensibles
    location ~* ^/\.(?!well-known\/) {
        deny all;
        return 404;
    }

    # Proxy a dHtools (Contenedor Docker en puerto 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Cabeceras de Proxy e Identificación de Cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets y Streamings
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts optimizados para descargas pesadas y conversiones extensas
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # Sin límite de tamaño de subida (para subida de cookies o archivos)
        client_max_body_size 0;

        # Buffer y Streaming en Tiempo Real
        proxy_buffering off;
        proxy_request_buffering off;

        # Cabecera de Privacidad y Anti-Indexación
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
