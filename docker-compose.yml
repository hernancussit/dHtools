services:
  dhtools:
    build: .
    container_name: yt-downloader
    depends_on:
      - potprovider
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8899:8899"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped

  potprovider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: pot-provider
    ports:
      - "127.0.0.1:4416:4416"
    restart: unless-stopped

  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt-api
    environment:
      API_URL: "http://cobalt:9000/"
      COOKIE_PATH: "/cookies.json"
      HTTP_PROXY: ${COBALT_HTTP_PROXY:-http://dhtools:8899}
      HTTPS_PROXY: ${COBALT_HTTPS_PROXY:-http://dhtools:8899}
      NO_PROXY: "127.0.0.1,localhost,cobalt,dhtools,potprovider"
    volumes:
      - ./cobalt_cookies.json:/cookies.json
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
