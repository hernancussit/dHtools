# ==============================================================================
# dHtools - cPanel & Apache Reverse Proxy Configuration
# ==============================================================================
# 
# OPCIÓN A: Archivo .htaccess en public_html (Si mod_proxy y mod_rewrite están activos)
# ------------------------------------------------------------------------------
# Pega las siguientes directivas en tu archivo .htaccess dentro de la raíz de tu dominio/subdominio:

<IfModule mod_rewrite.c>
    RewriteEngine On
    
    # Redireccionar HTTP a HTTPS automáticamente
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # Soporte para WebSockets
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:5000/$1 [P,L]

    # Proxy inverso HTTP hacia el contenedor Docker de dHtools (:5000)
    RewriteCond %{REQUEST_URI} !^/\.well-known
    RewriteRule ^(.*)$ http://127.0.0.1:5000/$1 [P,L]
</IfModule>

<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</IfModule>

# ==============================================================================
